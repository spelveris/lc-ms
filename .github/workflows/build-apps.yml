name: Build Desktop Apps (Main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lcms-desktop-builds
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(python -c 'import pathlib,re; text = pathlib.Path("app/config.py").read_text(); m = re.search(r"APP_VERSION\s*=\s*\"([^\"]+)\"", text); print(m.group(1) if m else "0.0.0")')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building app version: $VERSION"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Clean AppleDouble files from site-packages
        shell: python
        run: |
          import site, pathlib
          for sp in site.getsitepackages():
              for f in pathlib.Path(sp).rglob("._*"):
                  print(f"Removing: {f}")
                  f.unlink()

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller \
            --name=LCMS-Analysis \
            --onedir \
            --console \
            --add-data "app:app" \
            --copy-metadata streamlit \
            --copy-metadata altair \
            --collect-data streamlit \
            --hidden-import=streamlit \
            --hidden-import=streamlit.runtime.scriptrunner \
            --hidden-import=streamlit.runtime.scriptrunner.magic_funcs \
            --hidden-import=streamlit.web.cli \
            --hidden-import=rainbow \
            --hidden-import=scipy.signal \
            --hidden-import=scipy.integrate \
            --hidden-import=matplotlib.backends.backend_svg \
            --hidden-import=matplotlib.backends.backend_pdf \
            --hidden-import=matplotlib.backends.backend_agg \
            --exclude-module=torch \
            --exclude-module=tensorflow \
            --exclude-module=keras \
            --exclude-module=IPython \
            --exclude-module=jupyter \
            --exclude-module=notebook \
            --exclude-module=pytest \
            --exclude-module=tkinter \
            --exclude-module=_tkinter \
            --exclude-module=numpy.tests \
            --exclude-module=scipy.tests \
            --exclude-module=matplotlib.tests \
            --exclude-module=pandas.tests \
            --noconfirm \
            launcher.py

      - name: Build Windows app
        if: runner.os == 'Windows'
        run: |
          pyinstaller `
            --name=LCMS-Analysis `
            --onedir `
            --console `
            --add-data "app;app" `
            --copy-metadata streamlit `
            --copy-metadata altair `
            --collect-data streamlit `
            --hidden-import=streamlit `
            --hidden-import=streamlit.runtime.scriptrunner `
            --hidden-import=streamlit.runtime.scriptrunner.magic_funcs `
            --hidden-import=streamlit.web.cli `
            --hidden-import=rainbow `
            --hidden-import=scipy.signal `
            --hidden-import=scipy.integrate `
            --hidden-import=matplotlib.backends.backend_svg `
            --hidden-import=matplotlib.backends.backend_pdf `
            --hidden-import=matplotlib.backends.backend_agg `
            --exclude-module=torch `
            --exclude-module=tensorflow `
            --exclude-module=keras `
            --exclude-module=IPython `
            --exclude-module=jupyter `
            --exclude-module=notebook `
            --exclude-module=pytest `
            --exclude-module=tkinter `
            --exclude-module=_tkinter `
            --exclude-module=numpy.tests `
            --exclude-module=scipy.tests `
            --exclude-module=matplotlib.tests `
            --exclude-module=pandas.tests `
            --noconfirm `
            launcher.py

      - name: Remove AppleDouble files from dist
        shell: python
        run: |
          import pathlib
          dist = pathlib.Path("dist/LCMS-Analysis")
          for f in dist.rglob("._*"):
              print(f"Removing: {f}")
              f.unlink()

      - name: Smoke test app startup (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP_BIN="dist/LCMS-Analysis/LCMS-Analysis"
          "$APP_BIN" > app_stdout.log 2> app_stderr.log &
          APP_PID=$!
          echo "Launched PID: $APP_PID"
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:8501/_stcore/health" >/dev/null; then
              echo "Health check passed"
              kill "$APP_PID" || true
              wait "$APP_PID" || true
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed"
          tail -n 200 app_stdout.log || true
          tail -n 200 app_stderr.log || true
          kill "$APP_PID" || true
          wait "$APP_PID" || true
          exit 1

      - name: Smoke test app startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist\\LCMS-Analysis\\LCMS-Analysis.exe"
          $out = "app_stdout.log"
          $err = "app_stderr.log"
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8501/_stcore/health" -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) {
              Write-Host "Health check failed"
              if (Test-Path $out) { Get-Content $out -Tail 200 }
              if (Test-Path $err) { Get-Content $err -Tail 200 }
              throw "App did not become healthy"
            }
            Write-Host "Health check passed"
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Create ZIP (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r LCMS-Analysis-v${{ steps.app_version.outputs.version }}-macOS.zip LCMS-Analysis

      - name: Create ZIP (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist\LCMS-Analysis -DestinationPath dist\LCMS-Analysis-v${{ steps.app_version.outputs.version }}-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LCMS-Analysis-v${{ steps.app_version.outputs.version }}-${{ matrix.platform }}
          path: dist/LCMS-Analysis-v${{ steps.app_version.outputs.version }}-${{ matrix.platform }}.zip
          retention-days: 1

name: Build Desktop Apps (Release Tag)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: lcms-desktop-builds
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(python -c 'import pathlib,re; text = pathlib.Path("app/config.py").read_text(); m = re.search(r"APP_VERSION\\s*=\\s*\"([^\"]+)\"", text); print(m.group(1) if m else "0.0.0")')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building app version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Clean AppleDouble files from site-packages
        run: |
          python -c "
          import site, pathlib
          for sp in site.getsitepackages():
              for f in pathlib.Path(sp).rglob('._*'):
                  print(f'Removing: {f}')
                  f.unlink()
          "

      - name: Build macOS app
        run: |
          pyinstaller \
            --name=LCMS-Analysis \
            --onedir \
            --console \
            --add-data "app:app" \
            --copy-metadata streamlit \
            --copy-metadata altair \
            --collect-data streamlit \
            --hidden-import=streamlit \
            --hidden-import=streamlit.runtime.scriptrunner \
            --hidden-import=streamlit.runtime.scriptrunner.magic_funcs \
            --hidden-import=streamlit.web.cli \
            --hidden-import=rainbow \
            --hidden-import=scipy.signal \
            --hidden-import=scipy.integrate \
            --hidden-import=matplotlib.backends.backend_svg \
            --hidden-import=matplotlib.backends.backend_pdf \
            --hidden-import=matplotlib.backends.backend_agg \
            --exclude-module=torch \
            --exclude-module=tensorflow \
            --exclude-module=keras \
            --exclude-module=IPython \
            --exclude-module=jupyter \
            --exclude-module=notebook \
            --exclude-module=pytest \
            --exclude-module=tkinter \
            --exclude-module=_tkinter \
            --exclude-module=numpy.tests \
            --exclude-module=scipy.tests \
            --exclude-module=matplotlib.tests \
            --exclude-module=pandas.tests \
            --exclude-module=pydoc \
            --noconfirm \
            launcher.py

      - name: Remove AppleDouble files from dist
        run: |
          find dist/LCMS-Analysis -name '._*' -delete

      - name: Create ZIP
        run: |
          cd dist
          zip -r LCMS-Analysis-v${{ steps.app_version.outputs.version }}-macOS.zip LCMS-Analysis

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LCMS-Analysis-v${{ steps.app_version.outputs.version }}-macOS
          path: dist/LCMS-Analysis-v${{ steps.app_version.outputs.version }}-macOS.zip
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(python -c 'import pathlib,re; text = pathlib.Path("app/config.py").read_text(); m = re.search(r"APP_VERSION\\s*=\\s*\"([^\"]+)\"", text); print(m.group(1) if m else "0.0.0")')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building app version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Clean AppleDouble files from site-packages
        run: |
          python -c "
          import site, pathlib
          for sp in site.getsitepackages():
              for f in pathlib.Path(sp).rglob('._*'):
                  print(f'Removing: {f}')
                  f.unlink()
          "

      - name: Build Windows app
        run: |
          pyinstaller `
            --name=LCMS-Analysis `
            --onedir `
            --console `
            --add-data "app;app" `
            --copy-metadata streamlit `
            --copy-metadata altair `
            --collect-data streamlit `
            --hidden-import=streamlit `
            --hidden-import=streamlit.runtime.scriptrunner `
            --hidden-import=streamlit.runtime.scriptrunner.magic_funcs `
            --hidden-import=streamlit.web.cli `
            --hidden-import=rainbow `
            --hidden-import=scipy.signal `
            --hidden-import=scipy.integrate `
            --hidden-import=matplotlib.backends.backend_svg `
            --hidden-import=matplotlib.backends.backend_pdf `
            --hidden-import=matplotlib.backends.backend_agg `
            --exclude-module=torch `
            --exclude-module=tensorflow `
            --exclude-module=keras `
            --exclude-module=IPython `
            --exclude-module=jupyter `
            --exclude-module=notebook `
            --exclude-module=pytest `
            --exclude-module=tkinter `
            --exclude-module=_tkinter `
            --exclude-module=numpy.tests `
            --exclude-module=scipy.tests `
            --exclude-module=matplotlib.tests `
            --exclude-module=pandas.tests `
            --exclude-module=pydoc `
            --noconfirm `
            launcher.py

      - name: Remove AppleDouble files from dist
        shell: python
        run: |
          import pathlib
          dist = pathlib.Path("dist/LCMS-Analysis")
          for f in dist.rglob("._*"):
              print(f"Removing: {f}")
              f.unlink()

      - name: Create ZIP
        run: Compress-Archive -Path dist\LCMS-Analysis -DestinationPath dist\LCMS-Analysis-v${{ steps.app_version.outputs.version }}-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LCMS-Analysis-v${{ steps.app_version.outputs.version }}-Windows
          path: dist/LCMS-Analysis-v${{ steps.app_version.outputs.version }}-Windows.zip
          retention-days: 1

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(python -c 'import pathlib,re; text = pathlib.Path("app/config.py").read_text(); m = re.search(r"APP_VERSION\\s*=\\s*\"([^\"]+)\"", text); print(m.group(1) if m else "0.0.0")')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing app version: $VERSION"

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: LCMS-Analysis-v${{ steps.app_version.outputs.version }}-macOS

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: LCMS-Analysis-v${{ steps.app_version.outputs.version }}-Windows

      - name: List files
        run: ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LCMS-Analysis-v${{ steps.app_version.outputs.version }}-macOS.zip
            LCMS-Analysis-v${{ steps.app_version.outputs.version }}-Windows.zip
          body: |
            ## LC-MS Analysis Desktop App

            Download the ZIP for your platform:
            - **macOS**: LCMS-Analysis-v${{ steps.app_version.outputs.version }}-macOS.zip
            - **Windows**: LCMS-Analysis-v${{ steps.app_version.outputs.version }}-Windows.zip

            ### Installation

            **Windows:**
            1. Extract the ZIP file
            2. Double-click `LCMS-Analysis.exe`
            3. Your browser will open with the app

            **macOS:**
            1. Extract the ZIP file
            2. Open Terminal and run:
               ```
               xattr -cr ~/Downloads/LCMS-Analysis
               ```
            3. Double-click `LCMS-Analysis` or run `./LCMS-Analysis` in Terminal
            4. Your browser will open with the app

            ### Usage
            - Use **Browse Files** mode to select .D folders directly (no ZIP needed!)
            - Supports UV-Vis, TIC, EIC, and protein deconvolution
